name: Build Debate Night 2028
on: workflow_dispatch
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: mac }
          - { os: windows-latest, target: win }
          - { os: ubuntu-24.04, target: linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: node ci-build.mjs ${{ matrix.target }}
        env: { GH_TOKEN: "${{ github.token }}" }
      - uses: actions/upload-artifact@v7
        with: { name: "${{ matrix.target }}", path: out/* }
