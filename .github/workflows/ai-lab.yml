# Runs the game against the real AI on one of GitHub's Apple Silicon Macs (free for public repos):
# the same engine and model the app uses, with no window. It runs the AI lab and/or test debates and
# saves the reports to the "lab-reports" branch (runs/<number>-<mode>/), so they can be read and
# acted on without anyone's own computer. Start it from the Actions tab ("Run workflow").
# The lab and the debates run on separate machines at the same time; the debates are split across
# several machines too, so a run of six players takes about as long as one debate.
name: AI lab (real model)
run-name: "AI lab: ${{ inputs.mode }}${{ inputs.note && format(' · {0}', inputs.note) || '' }}"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        options: [lab, debates, both]
        default: lab
      personas:
        description: "Test players for debates, comma-separated (e.g. quick, react, win, liar, champion)"
        default: quick
      model:
        description: "Which AI"
        type: choice
        options: [standard, pocket, max]
        default: standard
      note:
        description: "What this run is checking (shows in the report)"
        default: ""
      machine:
        description: "Build machine: linux (4-core processor, many at once) or mac (a virtual M1 whose graphics chip the AI can't use, so it's slower)"
        type: choice
        options: [linux, mac]
        default: linux
      machines:
        description: "How many machines share the debates (each takes every Nth player)"
        default: "6"

permissions:
  contents: write

concurrency:
  group: ai-lab-${{ inputs.model }}
  cancel-in-progress: false

env:
  LLAMA_TAG: b11600

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      parts: ${{ steps.p.outputs.parts }}
    steps:
      - id: p
        env: { MODE: "${{ inputs.mode }}", N: "${{ inputs.machines }}" }
        run: |
          n=$(( ${N:-1} < 1 ? 1 : ${N:-1} )); n=$(( n > 18 ? 18 : n ))
          parts=()
          [ "$MODE" != debates ] && parts+=('{"part":"lab","tag":"lab","shard":0,"shards":1}')
          if [ "$MODE" != lab ]; then for i in $(seq 0 $((n-1))); do parts+=("{\"part\":\"debates\",\"tag\":\"d$((i+1))of$n\",\"shard\":$i,\"shards\":$n}"); done; fi
          echo "parts=[$(IFS=,; echo "${parts[*]}")]" >> "$GITHUB_OUTPUT"; cat "$GITHUB_OUTPUT"

  lab:
    needs: plan
    name: ${{ matrix.tag }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.parts) }}
    runs-on: ${{ inputs.machine == 'mac' && 'macos-15' || 'ubuntu-latest' }}
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22 }

      - name: Fetch the AI engine
        env: { GH_TOKEN: "${{ github.token }}" }
        run: node scripts/fetch-llama.mjs ${{ runner.os == 'macOS' && 'mac-arm64' || 'linux-x64' }}

      - name: Find the model file
        id: model
        run: |
          node -e '
            const m = require("./models.js").find(x => x.id === process.argv[1]);
            fetch(`https://huggingface.co/api/models/${m.repo}`).then(r => r.json()).then(j => {
              const files = (j.siblings || []).map(s => s.rfilename);
              const f = files.includes(m.file) ? m.file : files.find(n => n.endsWith(`-${m.quant}.gguf`)) || m.file;
              console.log(`repo=${m.repo}\nfile=${f}`);
            });' "${{ inputs.model }}" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Cache the model
        uses: actions/cache@v4
        with:
          path: ~/models
          key: model-${{ runner.os }}-${{ steps.model.outputs.file }}

      - name: Download the model (first run only)
        run: |
          mkdir -p ~/models
          f=~/models/"${{ steps.model.outputs.file }}"
          [ -s "$f" ] || curl -fL --retry 3 -o "$f" "https://huggingface.co/${{ steps.model.outputs.repo }}/resolve/main/${{ steps.model.outputs.file }}"
          ls -la ~/models

      - name: Install the hidden browser
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm i --no-audit --no-fund playwright@1.55.0
          npx playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium

      - name: About this machine
        run: |
          if [ "$RUNNER_OS" = macOS ]; then sysctl -n machdep.cpu.brand_string; sysctl -n hw.ncpu; echo "$(( $(sysctl -n hw.memsize) / 1073741824 )) GB"
          else lscpu | sed -n '1,20p'; free -g; fi

      - name: Run the game against the AI
        env:
          MODE: ${{ matrix.part }}
          TAG: ${{ matrix.tag }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
          PERSONAS: ${{ inputs.personas }}
          MODEL_ID: ${{ inputs.model }}
          MODEL_FILE: ${{ steps.model.outputs.file }}
          NOTE: ${{ inputs.note }}
          PW_DIR: ${{ runner.temp }}/pw
          OUT: ${{ runner.temp }}/lab-out
          HOURS: "5.2"
          NO_MLOCK: "1"
          PUBLISH_DIR: runs/${{ github.run_number }}-${{ inputs.mode }}
          GH_TOKEN: ${{ github.token }}
        run: |
          export MODEL_PATH="$HOME/models/$MODEL_FILE"
          node scripts/cloud-lab.mjs

      - name: Save the reports to the lab-reports branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_MODE: ${{ inputs.mode }}
          RUN_PERSONAS: ${{ inputs.personas }}
          RUN_MODEL: ${{ inputs.model }}
          RUN_NOTE: ${{ inputs.note }}
          RUN_MACHINE: ${{ inputs.machine }}
        run: |
          out="$RUNNER_TEMP/lab-out"; [ -d "$out" ] || { echo "No reports."; exit 0; }
          dest="runs/${{ github.run_number }}-$RUN_MODE"
          cd "$RUNNER_TEMP"; rm -rf rep
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git clone -q --depth 1 --branch lab-reports "$url" rep 2>/dev/null; then cd rep
          else mkdir rep && cd rep && git init -q -b lab-reports && git remote add origin "$url"
            printf '# AI lab reports\n\nWritten by the "AI lab (real model)" workflow. Each folder under runs/ is one run.\n' > README.md; fi
          mkdir -p "$dest" && cp "$out"/* "$dest"/
          printf '%s\n' "commit: ${GITHUB_SHA}" "mode: $RUN_MODE" "personas: $RUN_PERSONAS" "model: $RUN_MODEL" "machine: $RUN_MACHINE" "note: $RUN_NOTE" > "$dest/about.txt"
          git add -A
          git diff --cached --quiet && { echo "Already saved."; exit 0; }
          git -c user.name="AI lab" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Lab run ${{ github.run_number }} (${{ matrix.tag }}) at ${GITHUB_SHA::7}"
          for i in 1 2 3 4 5 6 7 8; do
            git push -q origin HEAD:lab-reports && { echo "Saved to lab-reports/$dest"; exit 0; }
            git pull -q --rebase -X theirs origin lab-reports || true; sleep $((RANDOM % 5 + 1))
          done
          exit 1

      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: "lab-reports-${{ matrix.tag }}", path: "${{ runner.temp }}/lab-out", if-no-files-found: ignore }
