# Runs the game against the real AI on one of GitHub's Apple Silicon Macs (free for public repos):
# the same engine and model the app uses, with no window. It runs the AI lab and/or test debates and
# saves the reports to the "lab-reports" branch (runs/<number>-<mode>/), so they can be read and
# acted on without anyone's own computer. Start it from the Actions tab ("Run workflow").
name: AI lab (real model)
run-name: "AI lab: ${{ inputs.mode }}${{ inputs.note && format(' · {0}', inputs.note) || '' }}"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        options: [lab, debates, both]
        default: lab
      personas:
        description: "Test players for debates, comma-separated (e.g. quick, react, win, liar, champion)"
        default: quick
      model:
        description: "Which AI"
        type: choice
        options: [standard, pocket, max]
        default: standard
      note:
        description: "What this run is checking (shows in the report)"
        default: ""

permissions:
  contents: write

concurrency:
  group: ai-lab
  cancel-in-progress: false

env:
  LLAMA_TAG: b11600

jobs:
  lab:
    runs-on: macos-15
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22 }

      - name: Fetch the AI engine
        env: { GH_TOKEN: "${{ github.token }}" }
        run: node scripts/fetch-llama.mjs mac-arm64

      - name: Find the model file
        id: model
        run: |
          node -e '
            const m = require("./models.js").find(x => x.id === process.argv[1]);
            fetch(`https://huggingface.co/api/models/${m.repo}`).then(r => r.json()).then(j => {
              const files = (j.siblings || []).map(s => s.rfilename);
              const f = files.includes(m.file) ? m.file : files.find(n => n.endsWith(`-${m.quant}.gguf`)) || m.file;
              console.log(`repo=${m.repo}\nfile=${f}`);
            });' "${{ inputs.model }}" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Cache the model
        uses: actions/cache@v4
        with:
          path: ~/models
          key: model-${{ steps.model.outputs.file }}

      - name: Download the model (first run only)
        run: |
          mkdir -p ~/models
          f=~/models/"${{ steps.model.outputs.file }}"
          [ -s "$f" ] || curl -fL --retry 3 -o "$f" "https://huggingface.co/${{ steps.model.outputs.repo }}/resolve/main/${{ steps.model.outputs.file }}"
          ls -la ~/models

      - name: Install the hidden browser
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm i --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium

      - name: About this machine
        run: |
          sysctl -n machdep.cpu.brand_string; sysctl -n hw.ncpu; echo "$(( $(sysctl -n hw.memsize) / 1073741824 )) GB"
          system_profiler SPDisplaysDataType | sed -n 1,15p

      - name: Run the game against the AI
        env:
          MODE: ${{ inputs.mode }}
          PERSONAS: ${{ inputs.personas }}
          MODEL_ID: ${{ inputs.model }}
          MODEL_FILE: ${{ steps.model.outputs.file }}
          NOTE: ${{ inputs.note }}
          PW_DIR: ${{ runner.temp }}/pw
          OUT: ${{ runner.temp }}/lab-out
          HOURS: "5.2"
          NO_MLOCK: "1"
          PUBLISH_DIR: runs/${{ github.run_number }}-${{ inputs.mode }}
          GH_TOKEN: ${{ github.token }}
        run: |
          export MODEL_PATH="$HOME/models/$MODEL_FILE"
          node scripts/cloud-lab.mjs

      - name: Save the reports to the lab-reports branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_MODE: ${{ inputs.mode }}
          RUN_PERSONAS: ${{ inputs.personas }}
          RUN_MODEL: ${{ inputs.model }}
          RUN_NOTE: ${{ inputs.note }}
        run: |
          out="$RUNNER_TEMP/lab-out"; [ -d "$out" ] || { echo "No reports."; exit 0; }
          dest="runs/${{ github.run_number }}-$RUN_MODE"
          cd "$RUNNER_TEMP"
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git clone --depth 1 --branch lab-reports "$url" rep 2>/dev/null; then cd rep
          else mkdir rep && cd rep && git init -q -b lab-reports && git remote add origin "$url"
            printf '# AI lab reports\n\nWritten by the "AI lab (real model)" workflow. Each folder under runs/ is one run.\n' > README.md; fi
          mkdir -p "$dest" && cp "$out"/* "$dest"/
          printf '%s\n' "commit: ${GITHUB_SHA}" "mode: $RUN_MODE" "personas: $RUN_PERSONAS" "model: $RUN_MODEL" "note: $RUN_NOTE" > "$dest/about.txt"
          git add -A
          git diff --cached --quiet && { echo "Already saved."; exit 0; }
          git -c user.name="AI lab" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Lab run ${{ github.run_number }}: $RUN_MODE at ${GITHUB_SHA::7}"
          git push -q origin HEAD:lab-reports
          echo "Saved to lab-reports/$dest"

      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: lab-reports, path: "${{ runner.temp }}/lab-out", if-no-files-found: ignore }
